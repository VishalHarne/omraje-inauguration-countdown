<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08120e" />
    <meta
      name="description"
      content="ओम राजे निंबाळकर यांच्या अधिकृत संकेतस्थळाच्या शुभारंभात सहभागी व्हा."
    />
    <title>ओम राजे.in — शुभारंभ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="launch-page">
      <img class="launch-backdrop" src="assets/night-rally-enhanced.jpg" alt="" />
      <img class="launch-portrait" src="assets/hero-banner-title.jpg" alt="" />
      <div class="launch-shade" aria-hidden="true"></div>

      <header class="launch-header">
        <a class="brand" href="https://omraje.in/" aria-label="ओम राजे.in मुख्यपृष्ठ">
          <span class="brand-name">
            <strong>ओम राजे</strong>
            <small>निंबाळकर</small>
          </span>
        </a>
        <span class="location">धाराशिव · महाराष्ट्र</span>
      </header>

      <section class="launch-content" aria-labelledby="launch-title">
        <p class="eyebrow"><span aria-hidden="true">✦</span> एका नव्या पर्वाची सुरुवात</p>
        <h1 id="launch-title">धाराशिवसाठी<br /><span>नवे डिजिटल व्यासपीठ.</span></h1>
        <p class="description">
          जनतेसाठी, त्यांच्या आवाजासाठी आणि आपण एकत्र करत असलेल्या कामासाठी एक व्यासपीठ.
        </p>

        <div class="countdown" aria-live="polite" aria-atomic="true">
          <span class="countdown-number" id="countdown-number">10</span>
          <span class="countdown-label">सेकंद बाकी</span>
        </div>

        <button class="start-button" id="start-button" type="button" lang="en">
          LAUNCH <span aria-hidden="true">↗</span>
        </button>
        <p class="launch-note" id="launch-note">ज्या क्षणाची आपण वाट पाहत होतो.</p>
      </section>

      <footer class="launch-footer">
        <span>जनतेसोबत. जनतेसाठी.</span>
        <a href="https://omraje.in/">संकेतस्थळावर जा <span aria-hidden="true">↗</span></a>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
